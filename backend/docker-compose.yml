services:
  postgres:
    image: postgres:16-alpine
    container_name: myeventscheduler-postgres
    environment:
      POSTGRES_DB: event_scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1812
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: myeventscheduler-redis
    ports:
      - "6379:6379"
    # volumes:
    #   - redis-data:/data
    command: redis-server --appendonly yes

  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler-service/Dockerfile
    container_name: myeventscheduler-scheduler-service
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PG_HOST: postgres
      PG_DATABASE: event_scheduler
      PG_USER: postgres
      PG_PASSWORD: 1812
      PG_PORT: 5432
      REDIS_PORT: 6379
      REDIS_HOST: redis
      APP_ENV: production
      PORT: 9001
      NOTIFICATION_PORT: 9002
    ports:
      - "9001:9001"
  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    container_name: myeventscheduler-worker-service
    depends_on:
      redis:
        condition: service_started
      scheduler-service:
        condition: service_started
    environment:
      APP_ENV: production
      SCHEDULER_SERVICE_BASE_URL: http://scheduler-service:9001
      REDIS_PORT: 6379
      REDIS_HOST: redis
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: myeventscheduler-notification-service
    depends_on:
      - redis
    environment:
      NODE_ENV: production
      REDIS_PORT: 6379
      REDIS_HOST: redis
      APP_ENV: production
      PORT: 9002
    ports:
      - "9002:9002"
  frontend:
    build:
      context: ./../frontend
      dockerfile: Dockerfile
    depends_on:
      - scheduler-service
    ports:
      - "3000:80"
volumes:
  postgres-data:
